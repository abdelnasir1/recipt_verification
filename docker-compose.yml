services:
  receipt-verifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt_verifier
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_BUCKET: receipts
      OCR_LANGUAGE: ar
      USE_GPU: "false"
      UPDATE_DATABASE: "true"
      DATABASE_TABLE: payments
      DEBUG: "false"
      PORT: 8000
      HOST: 0.0.0.0
      WORKERS: 1
      REDIS_URL: redis://127.0.0.1:6379/0
      ACCOUNT_NUMBER: ${ACCOUNT_NUMBER:?ACCOUNT_NUMBER is required}
      AMOUNT: ${AMOUNT:?AMOUNT is required}
    ports:
      - "8000:8000"
    volumes:
      - ./reference_receipt.jpg:/app/reference_receipt.jpg

