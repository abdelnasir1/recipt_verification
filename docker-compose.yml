version: '3.8'

services:
  receipt-verifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt_verifier
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_BUCKET: receipts
      OCR_LANGUAGE: ar
      USE_GPU: "false"
      UPDATE_DATABASE: "true"
      DATABASE_TABLE: payments
      DEBUG: "false"
      PORT: 8000
      HOST: 0.0.0.0
      WORKERS: 1
    ports:
      - "8000:8000"
    volumes:
      - ./reference_receipt.jpg:/app/reference_receipt.jpg

